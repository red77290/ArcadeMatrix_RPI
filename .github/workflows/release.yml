name: Build and Release ArcadeMatrix

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_size:
        description: 'Target Image Size (e.g. 14G, 8G)'
        required: true
        default: '14G'

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test

  publish-ota-binaries:
    name: Build OTA Binary (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross

      - name: Cross Build Release Binary
        run: cross build --target ${{ matrix.target }} --release

      - name: Package Binary for OTA
        run: |
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          BINARY_NAME="arcadematrix_${GITHUB_REF_NAME}_${ARCH}"
          cp "target/${{ matrix.target }}/release/arcadematrix" "$BINARY_NAME"
          strip "$BINARY_NAME" || true

      - name: Upload OTA Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: arcadematrix_*
          generate_release_notes: true

  build-image:
    name: Build Precompiled SD Image (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [aarch64, armhf]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Cargo.toml version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static kpartx dosfstools exfatprogs xz-utils parted

      - name: Run Build Image Script
        run: |
          chmod +x scripts/build_image.sh scripts/docker_builder.sh scripts/build_local.sh scripts/chroot_setup.sh
          TARGET_SIZE="${{ github.event.inputs.image_size || '14G' }}"
          sudo ./scripts/build_image.sh $TARGET_SIZE ${{ matrix.arch }}

      - name: Compress Image
        run: |
          sudo chown $USER:$USER ArcadeMatrix_Release_${{ matrix.arch }}.img
          xz -T0 -9 ArcadeMatrix_Release_${{ matrix.arch }}.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ArcadeMatrix_Release_${{ matrix.arch }}.img.xz
          generate_release_notes: true
