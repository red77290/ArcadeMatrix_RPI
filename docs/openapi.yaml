openapi: 3.0.3
info:
  title: ArcadeMatrix RPi Local API
  description: >
    Local HTTP API exposed by the ArcadeMatrix Raspberry Pi firmware (Actix-web,
    default port 8080). It drives the schema-driven Web UI: engines are
    auto-discovered from the registry (`GET /api/engines`), configured as
    generic instances (`/api/instances`), and sequenced by the rotation
    (`/api/rotation`). All config writes are self-healed (defaults injected,
    out-of-range values clamped/fallback) before being persisted atomically to
    `config.json`, and the running engine is notified live via
    `on_config_changed()`.
  version: 3.0.0
servers:
  - url: http://arcadematrix.local:8080
    description: Default local mDNS address
  - url: http://127.0.0.1:8080
    description: Local dev server (Mock matrix on Mac/Windows/Linux)

tags:
  - name: Engines
    description: Auto-discovery of registered engines and their config schema
  - name: Instances
    description: Generic engine instances (engine_id + config map)
  - name: Rotation
    description: Ordered rotation of instances shown on the panel
  - name: System
    description: System settings, stats, power and Wi-Fi
  - name: Integrations
    description: MQTT/console sync and marquee upload
  - name: Firmware
    description: OTA update and version
  - name: Media
    description: Fonts and GIF playlists (dynamic option sources)

security:
  - ApiToken: []

paths:
  /api/engines:
    get:
      tags: [Engines]
      summary: List all registered engine descriptors
      description: >
        Returns every engine known to the registry, each with its metadata,
        capabilities, requirements and full `ConfigSchema`. The Web UI uses this
        to render forms dynamically without knowing engines ahead of time.
      responses:
        '200':
          description: Array of engine descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/instances:
    get:
      tags: [Instances]
      summary: List configured engine instances
      responses:
        '200':
          description: Array of instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Instances]
      summary: Create or update an instance (upsert)
      description: >
        Upserts by `instance_id`. Rejects unknown `engine_id` values (not in the
        registry). The config map is self-healed, then the runtime picks up the
        change immediately (rotation reset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineInstance'
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '400':
          description: Unknown engine_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/instances/{id}:
    delete:
      tags: [Instances]
      summary: Delete an instance by id
      description: >
        Removes the instance and any rotation entry that referenced it, so the
        render loop never points at a dangling `instance_id`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rotation:
    get:
      tags: [Rotation]
      summary: Get the current rotation
      responses:
        '200':
          description: Ordered list of rotation entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RotationEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rotation]
      summary: Replace the whole rotation
      description: Replaces the rotation list; the runtime resets to apply it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RotationEntry'
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system:
    get:
      tags: [System]
      summary: Get system, matrix, wifi, mqtt settings
      responses:
        '200':
          description: Grouped configuration blocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  system:
                    $ref: '#/components/schemas/SystemConfig'
                  matrix:
                    $ref: '#/components/schemas/MatrixConfig'
                  mqtt:
                    $ref: '#/components/schemas/MqttConfig'
                  wifi:
                    $ref: '#/components/schemas/WifiConfig'
                  api_auth_enabled:
                    type: boolean
                  api_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [System]
      summary: Update system settings (partial merge)
      description: >
        Any subset of `system`, `matrix`, `mqtt`, `wifi`, plus the top-level
        `api_auth_enabled` / `api_token` may be sent. `brightness_limit` (alias
        `brightness`, 0-100) is applied live without a restart. Changes to matrix
        parameters or the Wi-Fi radio state flag a render-loop reload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system:
                  $ref: '#/components/schemas/SystemConfig'
                matrix:
                  $ref: '#/components/schemas/MatrixConfig'
                mqtt:
                  $ref: '#/components/schemas/MqttConfig'
                wifi:
                  $ref: '#/components/schemas/WifiConfig'
                api_auth_enabled:
                  type: boolean
                api_token:
                  type: string
                brightness_limit:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stats:
    get:
      tags: [System]
      summary: Live system stats
      description: CPU load, RAM, SoC temperature, free disk, uptime and version.
      responses:
        '200':
          description: Runtime stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  arch:
                    type: string
                  uptime:
                    type: integer
                    description: Seconds since boot
                  cpu_load:
                    type: number
                  ram_used_mb:
                    type: integer
                  ram_total_mb:
                    type: integer
                  memory_used:
                    type: integer
                    description: Alias of ram_used_mb (UI compatibility)
                  memory_total:
                    type: integer
                    description: Alias of ram_total_mb (UI compatibility)
                  temperature_c:
                    type: number
                  disk_free_gb:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/power:
    post:
      tags: [System]
      summary: Turn the LED panel output on/off
      description: Toggles the live matrix power flag; the daemon keeps running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: boolean
                  description: true = panel ON (default), false = panel OFF
      responses:
        '200':
          description: New power state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  power:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/reboot:
    post:
      tags: [System]
      summary: Reboot the Raspberry Pi
      responses:
        '200':
          description: Rebooting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rebooting
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/shutdown:
    post:
      tags: [System]
      summary: Power off the Raspberry Pi
      responses:
        '200':
          description: Shutting down
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: shutting_down
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/restart:
    post:
      tags: [System]
      summary: Restart the ArcadeMatrix application (not the OS)
      description: >
        Gracefully stops the render loop so the process exits and systemd
        (Restart=always) relaunches it within a few seconds. Applies
        hardware-level settings without a full OS reboot.
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: restarting
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/restart_app:
    post:
      tags: [System]
      summary: Restart the ArcadeMatrix application (Alias to /api/system/restart)
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: restarting
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/action/reboot:
    get:
      tags: [System]
      summary: Reboot the Raspberry Pi (legacy GET alias)
      description: Kept for backward compatibility; prefer POST /api/system/reboot.
      deprecated: true
      responses:
        '200':
          description: Rebooting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rebooting
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/wifi:
    post:
      tags: [System]
      summary: Set Wi-Fi credentials
      description: >
        Stores SSID/password and marks the profile as not-yet-applied, then flags
        a reload so the boot provisioning re-applies the NetworkManager profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '400':
          description: SSID missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/upload:
    post:
      tags: [System]
      summary: Upload an asset file with single-file overwrite
      description: >
        multipart/form-data upload. Saves file into target storage folder (e.g. data/marquees/)
        with single-file overwrite. Returns resolved file path.
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: Upload destination category (e.g. marquee)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '400':
          description: Invalid or unreadable image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/marquee:
    post:
      tags: [Integrations]
      summary: Upload a marquee image to display now
      description: >
        multipart/form-data image upload. The decoded image is shown immediately
        by forcing the `marquee` engine.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/StatusOk'
        '400':
          description: Invalid or unreadable image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/mqtt/install:
    post:
      tags: [Integrations]
      summary: Install the game-sync script on a console over SSH
      description: >
        SSHes into a Recalbox, Batocera, or RetroPie console at `ip` and installs the script
        that publishes the running game to this matrix on topic `system/playing/<os>`. Returns the install log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                user:
                  type: string
                pass:
                  type: string
                os:
                  type: string
                  enum: [auto, recalbox, batocera, retropie]
                  default: auto
      responses:
        '200':
          description: Install log
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  log:
                    type: string
        '400':
          description: Missing IP or SSH failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/mqtt/logs:
    post:
      tags: [Integrations]
      summary: Fetch the console-side sync logs over SSH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                user:
                  type: string
                pass:
                  type: string
                os:
                  type: string
                  enum: [auto, recalbox, batocera, retropie]
                  default: auto
      responses:
        '200':
          description: Log text
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  logs:
                    type: string
        '400':
          description: Missing IP or SSH failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/version:
    get:
      tags: [Firmware]
      summary: Firmware version and build info
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  platform:
                    type: string
                    example: rpi
                  arch:
                    type: string
                  build_date:
                    type: string
                  git_commit:
                    type: string
                    description: Short git commit hash of the built source tree (or "unknown").
                    example: cb8723e

  /api/update:
    post:
      tags: [Firmware]
      summary: OTA firmware upload
      description: >
        multipart/form-data upload of a compiled ELF binary. The payload is
        validated (ELF magic + matching CPU architecture) before replacing the
        running binary. Architecture mismatch is bypassed in debug builds only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Update accepted; daemon restarts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Invalid firmware (bad magic, too small, or arch mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/fonts:
    get:
      tags: [Media]
      summary: List available fonts (dynamic option source)
      description: >
        Enumerates `.ttf`/`.bdf` files in `fonts/`. Consumed by schema fields
        that declare `options_endpoint: /api/fonts`.
      responses:
        '200':
          description: value/label option list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/themes:
    get:
      tags: [Media]
      summary: List available clock/date themes (dynamic option source)
      description: >
        Enumerates every theme from the single source of truth
        (`core::theme::all_themes()`). Each entry is `{value: "<id>", label:
        "<name>"}`. Consumed by schema fields that declare
        `options_endpoint: /api/themes` (clock and date `theme`). Adding a new
        theme in the firmware automatically extends this list.
      responses:
        '200':
          description: value/label option list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ota/check:
    get:
      tags: [Firmware]
      summary: Check GitHub Releases for online OTA updates
      description: >
        Fetches latest release from GitHub API, matching target CPU architecture
        (aarch64/armv7) against current running binary. Returns update_available flag.
      responses:
        '200':
          description: Release update check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:
                    type: string
                  current_arch:
                    type: string
                  latest_version:
                    type: string
                  update_available:
                    type: boolean
                  release_name:
                    type: string
                  release_notes:
                    type: string
                  download_url:
                    type: string
                  asset_name:
                    type: string
                  asset_size:
                    type: integer

  /api/ota/auto-update:
    post:
      tags: [Firmware]
      summary: 1-Click Online OTA Download and Installation
      description: >
        Downloads target release binary from GitHub, validates ELF magic & architecture,
        atomically replaces binary at runtime and schedules service restart.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                download_url:
                  type: string
      responses:
        '200':
          description: Download complete, service restarting
        '400':
          description: Architecture mismatch or invalid download
        '502':
          description: Download network failure

  /api/playlists:
    get:
      tags: [Media]
      summary: List GIF playlists (dynamic option source)
      description: Enumerates sub-folders of `gifs/` (yoko) and `gifs_tate/` (tate).
      responses:
        '200':
          description: value/label option list with orientation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      example: "/gifs/arcade"
                    label:
                      type: string
                      example: "arcade"
                    orientation:
                      type: string
                      enum: [yoko, tate]
                      example: "yoko"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/gifs/playlists:
    get:
      tags: [Media]
      summary: Detailed GIF playlists map
      description: Returns map of horizontal (yoko) and vertical (tate) GIF playlists with file counts.
      responses:
        '200':
          description: Map of yoko and tate folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  yoko:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                        count:
                          type: integer
                  tate:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/gifs/library:
    get:
      tags: [Media]
      summary: Playlist folders of one GIF library
      description: >
        Live scan of the selected orientation's root: `/gifs` (yoko) or `/gifs_tate` (tate).
      parameters:
        - $ref: '#/components/parameters/Orientation'
      responses:
        '200':
          description: Folder map with per-folder file counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GifLibrary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/gifs/files:
    get:
      tags: [Media]
      summary: List the media files of one playlist folder
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder:
                    type: string
                  orientation:
                    type: string
                    enum: [yoko, tate]
                  path:
                    type: string
                    example: "/gifs_tate/Arcade"
                  count:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        bytes:
                          type: integer
        '400':
          description: folder is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Folder not found

  /api/gifs/file:
    get:
      tags: [Media]
      summary: Serve one media file
      description: Inline by default; `download=1` sets a `Content-Disposition` attachment header.
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
        - $ref: '#/components/parameters/GifName'
        - in: query
          name: download
          schema:
            type: string
            enum: ['1']
          description: Send as an attachment instead of inline
      responses:
        '200':
          description: The file bytes
          content:
            image/gif: {}
            image/png: {}
            application/octet-stream: {}
        '400':
          description: folder and name are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: File not found
    delete:
      tags: [Media]
      summary: Delete one media file
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
        - $ref: '#/components/parameters/GifName'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  orientation:
                    type: string
                    enum: [yoko, tate]
                  deleted:
                    type: string
                    example: "/gifs_tate/Arcade/logo.gif"
        '400':
          description: folder and name (.gif/.png/.raw) are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: File not found

  /api/gifs/folder:
    delete:
      tags: [Media]
      summary: Delete a playlist folder and everything in it
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
      responses:
        '200':
          description: Deleted, with the number of files removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  orientation:
                    type: string
                    enum: [yoko, tate]
                  deleted:
                    type: string
                  files:
                    type: integer
        '400':
          description: folder is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Folder not found

  /api/gifs/mkdir:
    post:
      tags: [Media]
      summary: Create a playlist folder
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  folder:
                    type: string
                  orientation:
                    type: string
                    enum: [yoko, tate]
                  path:
                    type: string
        '400':
          description: folder must be a plain name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Folder already exists

  /api/gifs/rename:
    post:
      tags: [Media]
      summary: Rename a playlist folder, or a file inside one
      description: Renames the folder when `name` is omitted, otherwise the named file within it.
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
        - in: query
          name: name
          schema:
            type: string
          description: File to rename; omit to rename the folder itself
        - in: query
          name: to
          required: true
          schema:
            type: string
          description: New plain name (the original extension is kept if omitted)
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  orientation:
                    type: string
                    enum: [yoko, tate]
                  renamed_to:
                    type: string
        '400':
          description: folder and to are required (plain names)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Source not found
        '409':
          description: Target already exists

  /api/gifs/upload:
    post:
      tags: [Media]
      summary: Upload one or many media files into a playlist folder
      description: >
        Multipart upload. The folder is created when missing; an empty `folder` defaults to `Uploads`.
        Files that are not `.gif`, `.png` or `.raw` are reported under `skipped`.
      parameters:
        - $ref: '#/components/parameters/Orientation'
        - $ref: '#/components/parameters/GifFolder'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: At least one file was saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GifUploadResult'
        '400':
          description: Nothing was saved, or the folder name contains path separators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GifUploadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/gifs/reindex:
    post:
      tags: [Media]
      summary: Rescan the GIF library
      description: >
        Scans **both** orientations and reports the combined totals plus a per-orientation breakdown.
        The Pi scans live, so this returns when the scan is done; the panel shows an "Indexing GIF
        library" notice for at least three seconds so the action is visible. Only one rescan runs at a
        time — a concurrent request is rejected with `409`.
      parameters:
        - $ref: '#/components/parameters/Orientation'
      responses:
        '200':
          description: Combined scan result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GifLibrary'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      files:
                        type: integer
                        description: Combined file count across both orientations
                      folder_count:
                        type: integer
                        description: Combined folder count across both orientations
                      last_result:
                        type: string
                        example: "ok: 12 folders, 480 files (yoko + tate)"
                      orientations:
                        type: object
                        description: Per-orientation scan results
                        properties:
                          yoko:
                            $ref: '#/components/schemas/GifLibrary'
                          tate:
                            $ref: '#/components/schemas/GifLibrary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rescan is already running
    delete:
      tags: [Media]
      summary: Cancel a running rescan
      description: >
        Mirrors the ESP32 cancel route. The Pi scan is synchronous, so there is never anything to
        cancel and this always answers `409`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Nothing to cancel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: idle

  /api/gifs/reindex/status:
    get:
      tags: [Media]
      summary: Rescan progress
      description: Same response shape as the ESP32 firmware so one dashboard card can poll either.
      responses:
        '200':
          description: Current rescan state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  total:
                    type: integer
                  done:
                    type: integer
                  files:
                    type: integer
                  expected:
                    type: integer
                  eta:
                    type: string
                  cancelling:
                    type: boolean
                  current:
                    type: string
                  last_result:
                    type: string
                  elapsed_ms:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: >
        Required only when `api_auth_enabled` is true. Send the configured
        `api_token`. When auth is disabled, the header is ignored.

  parameters:
    Orientation:
      in: query
      name: orientation
      required: false
      schema:
        type: string
        enum: [yoko, tate]
        default: yoko
      description: >
        Which GIF library to act on: `yoko` is the horizontal root (`/gifs`), `tate` the vertical one
        (`/gifs_tate`). Unrecognised values fall back to `yoko`.
    GifFolder:
      in: query
      name: folder
      required: true
      schema:
        type: string
      description: Playlist folder name (a plain name; path separators are rejected)
    GifName:
      in: query
      name: name
      required: true
      schema:
        type: string
      description: File name inside the playlist folder (`.gif`, `.png` or `.raw`)

  responses:
    StatusOk:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
    Unauthorized:
      description: Missing or invalid X-API-Token header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    GifLibrary:
      type: object
      properties:
        root:
          type: string
          enum: ['/gifs', '/gifs_tate']
        orientation:
          type: string
          enum: [yoko, tate]
        folders:
          type: object
          additionalProperties:
            type: object
            properties:
              path:
                type: string
              count:
                type: integer
    GifUploadResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        folder:
          type: string
        orientation:
          type: string
          enum: [yoko, tate]
        count:
          type: integer
        saved:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              bytes:
                type: integer
        skipped:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string

    Option:
      type: object
      description: Generic value/label pair used by dynamic option endpoints.
      properties:
        value:
          type: string
        label:
          type: string

    EngineInstance:
      type: object
      description: A configured, generic engine instance.
      required: [instance_id, engine_id, config]
      properties:
        instance_id:
          type: string
          example: clock_main
        engine_id:
          type: string
          example: clock
        config:
          type: object
          additionalProperties:
            type: string
          description: Free-form string map validated against the engine schema.

    RotationEntry:
      type: object
      required: [instance_id, duration_sec]
      properties:
        instance_id:
          type: string
        duration_sec:
          type: integer
          description: Base display duration; engines may end early via is_finished().
        overlays:
          type: object
          description: Transverse additive overlay configurations.
          properties:
            fighter:
              type: boolean
              description: Per-screen toggle for the M.U.G.E.N fighter overlay.

    EngineDescriptor:
      type: object
      description: Full self-description of an engine returned by /api/engines.
      properties:
        metadata:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            category:
              type: string
            version:
              type: string
        capabilities:
          type: object
          properties:
            supports_128x32:
              type: boolean
            supports_256x64:
              type: boolean
            realtime:
              type: boolean
              description: >
                true = updated/rendered every frame (~25-60 FPS cadence);
                false = low-frequency cadence.
            interruptible:
              type: boolean
            allows_overlay:
              type: boolean
              description: Whether this engine authorizes transverse overlays (like Fighter).
            allow_rotation:
              type: boolean
              description: Whether this engine can be selected by users in the rotation loop.
        requirements:
          type: object
          properties:
            needs_audio:
              type: boolean
            needs_network:
              type: boolean
            needs_sd:
              type: boolean
        schema:
          type: object
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/ConfigField'

    ConfigField:
      type: object
      description: One field of an engine's config schema (drives a UI control).
      properties:
        id:
          type: string
        field_type:
          type: string
          enum: [Boolean, Integer, Float, String, Options]
        label:
          type: string
        description:
          type: string
        default_value:
          type: string
        required:
          type: boolean
        min_val:
          type: string
          nullable: true
        max_val:
          type: string
          nullable: true
        step:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Option'
        visible_when:
          type: string
          nullable: true
          description: Conditional visibility expression (e.g. "theme=2").
        options_endpoint:
          type: string
          nullable: true
          description: Endpoint to fetch dynamic options (e.g. /api/fonts).
        multiple:
          type: boolean
          description: true = multi-select (comma-separated stored value).
        validation_policy:
          type: string
          enum: [Clamp, FallbackDefault, Reject, Accept]

    SystemConfig:
      type: object
      properties:
        timezone:
          type: string
        format_24h:
          type: boolean
        lang:
          type: string
        unit:
          type: string
          description: metric | imperial
        temp_offset:
          type: number
        night_mode_enabled:
          type: boolean
        turn_off_at:
          type: string
          example: "23:00"
        wake_up_at:
          type: string
          example: "07:00"
        night_brightness:
          type: integer
        day_brightness:
          type: integer
          description: Live daytime brightness (0-100), persisted across restarts.
        idle_fighter_enabled:
          type: boolean
          description: Whether the Fighter overlay is enabled during idle rotation.
        idle_fighter_interval:
          type: integer
          description: Interval between fight animations in seconds.
        idle_fighter_speed:
          type: integer
          minimum: 25
          maximum: 200
          description: Fighter animation and combat speed percentage (25-200%).

    MatrixConfig:
      type: object
      description: Hardware panel configuration (changes require a render reload).
      properties:
        width:
          type: integer
        height:
          type: integer
        panel_type:
          type: string
        chain_length:
          type: integer
        power_limit_percent:
          type: integer
        force_single_buffer:
          type: boolean
        color_depth:
          type: integer
        rgb_sequence:
          type: string
        limit_refresh_rate_hz:
          type: integer
        driver_chip:
          type: string
        clk_phase:
          type: boolean
        latch_blanking:
          type: integer
        row_address_mode:
          type: integer
        matrix_power:
          type: boolean
        multiplexing:
          type: integer
        slowdown:
          type: integer
        pwm_bits:
          type: integer
        pwm_lsb_nanoseconds:
          type: integer
        disable_hardware_pulsing:
          type: boolean
        mapping:
          type: string

    WifiConfig:
      type: object
      properties:
        ssid:
          type: string
        password:
          type: string
        hostname:
          type: string
        configured:
          type: boolean
        disable_internal:
          type: boolean
          description: Disable the Pi's built-in Wi-Fi radio.

    MqttConfig:
      type: object
      properties:
        enabled:
          type: boolean
        broker:
          type: string
        port:
          type: integer
        user:
          type: string
        pass:
          type: string
        device_name:
          type: string
        allow_overlay:
          type: boolean
