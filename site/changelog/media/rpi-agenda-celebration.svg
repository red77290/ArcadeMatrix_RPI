<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="rpiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="100%" stop-color="#19081e"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <pattern id="rpiDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.7" fill="rgba(255,255,255,0.035)"/>
    </pattern>
    <filter id="glowRpi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="636" height="196" rx="14" fill="url(#rpiBg)" stroke="#ff0055" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="10" y="10" width="620" height="180" rx="10" fill="url(#rpiDots)"/>

  <!-- Left: Rust iCal Agenda Engine -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="286" height="156" rx="10" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.32)"/>
    <text x="16" y="26" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">🍓 RUST AGENDA ENGINE (ICS)</text>

    <rect x="16" y="42" width="254" height="32" rx="6" fill="rgba(0, 240, 255, 0.12)"/>
    <circle cx="30" cy="58" r="4.5" fill="#00e676">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="62" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">NOW • FIGHTCADE RANKED SET</text>

    <rect x="16" y="82" width="254" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="28" y="101" fill="#c7d0dd" font-family="monospace" font-size="11">19:00 • SHMUP SCORE ATTACK</text>

    <rect x="16" y="120" width="254" height="24" rx="5" fill="#0b0816" stroke="rgba(255,255,255,0.1)"/>
    <text x="26" y="136" fill="#00e676" font-family="monospace" font-size="10">ASYNC TOKIO POLLER • ZERO FRAME DROP</text>
  </g>

  <!-- Right: RetroAchievements & High Score Fireworks -->
  <g transform="translate(330, 22)">
    <rect x="0" y="0" width="288" height="156" rx="10" fill="rgba(255, 0, 85, 0.07)" stroke="rgba(255, 204, 0, 0.45)"/>
    <text x="16" y="26" fill="#ffcc00" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glowRpi)">🎆 RETROACHIEVEMENTS FIREWORKS</text>

    <!-- Firework Particles -->
    <g transform="translate(52, 82)" filter="url(#glowRpi)">
      <circle cx="0" cy="0" r="5" fill="#ffcc00"/>
      <circle cx="-18" cy="-14" r="3" fill="#ff0055">
        <animate attributeName="r" values="2;4.5;2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="-14" r="3" fill="#00f0ff">
        <animate attributeName="r" values="4;2;4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-16" cy="15" r="3" fill="#00e676"/>
      <circle cx="16" cy="15" r="3" fill="#ffcc00"/>
    </g>

    <text x="96" y="64" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">METAL SLUG X — 1CC CLEAR!</text>
    <text x="96" y="84" fill="#ffcc00" font-family="monospace" font-size="11">HI-SCORE: 4,210,900 PTS</text>
    <text x="96" y="102" fill="#9ba1a6" font-family="monospace" font-size="10">RECALBOX / BATOCERA / RETROARCH</text>

    <rect x="16" y="120" width="256" height="22" rx="5" fill="url(#berryGrad)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="144" y="135" fill="#080612" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">120 HZ HZ-LOCKED CELEBRATION SCENE</text>
  </g>
</svg>
