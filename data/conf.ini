[WIFI]
# ---------------------------------------------------------
# Wi-Fi Configuration
# ---------------------------------------------------------
# Enter your Wi-Fi credentials here to let the Raspberry Pi auto-connect.
# Leave blank if using Ethernet.
# Example: SSID = MyNetworkName
SSID = 
# Example: PASS = MySecretPassword
PASS = 
# Set CONFIGURED to false to force the system to attempt connection on next boot.
# It will automatically turn to true once successfully connected.
CONFIGURED = false
# ---------------------------------------------------------
# Set to true to physically disable the Raspberry Pi's internal Wi-Fi chip.
# CRITICAL: Use this if you bought an external USB Wi-Fi dongle to get
# perfect matrix image quality without crashes on Pi 3 / Zero W.
DISABLE_INTERNAL_WIFI = false

[MATRIX]
# ---------------------------------------------------------
# LED Matrix Hardware Settings
# ---------------------------------------------------------
# Number of rows per panel (usually 32 or 64)
ROWS = 32
# Number of columns per panel (usually 64)
COLS = 64
# Hardware mapping depends on your wiring/HAT: adafruit-hat, adafruit-hat-pwm, regular, regular-pi1
HARDWARE_MAPPING = regular
# Default brightness from 1 to 100
BRIGHTNESS = 20
# Number of panels daisy-chained together (e.g. 2 for a 128x32 display made of two 64x32 panels)
CHAIN = 2
# Number of parallel chains (default is 1)
PARALLEL = 1
# Slowdown GPIO speed for faster Pi models (e.g. 2, 3, or 4 for Pi 4). Adjust if the display glitches.
SLOWDOWN = 4
# Color sequence of your panels. Change to RBG, BGR, etc., if colors look wrong.
RGB_SEQUENCE = BRG
# PWM bits for color depth (11 is default, lower values reduce CPU usage but degrade colors)
PWM_BITS = 11
# LSB Nanoseconds to control PWM timing (default 130)
PWM_LSB_NANOSECONDS = 130
# Limit refresh rate to save CPU/DMA bandwidth (0 = unlimited, 60-120 recommended if Wi-Fi drops)
LIMIT_REFRESH_RATE_HZ = 120
# [CRITICAL HARDWARE SETTING - WI-FI CONFLICT]
# If false: Uses hardware PWM. Eliminates all flickering/glitches (perfect image). BUT IT CRASHES INTERNAL WI-FI. Must use Ethernet or USB Wi-Fi dongle.
# If true : Uses software loops. Internal Wi-Fi works perfectly, but causes slight flickering/VHS lines on the matrix.
DISABLE_HARDWARE_PULSING = true


[MQTT]
# ---------------------------------------------------------
# MQTT Integration (For Batocera/Recalbox status)
# ---------------------------------------------------------
# Set to true to enable MQTT listener
ENABLED = false
# IP address of your MQTT Broker
BROKER = 127.0.0.1
PORT = 1883
USER = 
PASS = 
# Device name used for connecting
DEVICE_NAME = ArcadeMatrixRPi
# Topics to listen to for current playing game
TOPIC_BATOCERA = batocera/system/playing
TOPIC_RECALBOX = recalbox/system/playing

[TIME]
# ---------------------------------------------------------
# Clock Settings
# ---------------------------------------------------------
# Use 24-hour format (true) or 12-hour AM/PM format (false)
FORMAT_24H = true
# Font file used for the digital clock (must be inside /fonts/)
CLOCK_FONT = 10x20.bdf
# Multiplier for the font size (1, 2, 3...)
CLOCK_SIZE = 1
# Clock style ID (from 1 to 18, check Web UI for list)
CLOCK_THEME = 18
# Offset to nudge the clock left/right (pixels)
CLOCK_OFFSET_X = 0
# Offset to nudge the clock up/down (pixels)
CLOCK_OFFSET_Y = 0
# Primary and Secondary colors (Hex format: #RRGGBB)
CLOCK_COLOR_1 = #ffffff
CLOCK_COLOR_2 = #ffffff

[IDLE]
# ---------------------------------------------------------
# Playlist & Rotation Behavior
# ---------------------------------------------------------
# Rotation mode: 'clock' (fixed clock), 'gifs' (fixed gifs), 'sprites' (fixed sprites), or 'all' (cycles through everything)
ROTATION = clock
# How many seconds the Clock stays on screen before rotating
CLOCK_DURATION_SEC = 15
# How many seconds the Date stays on screen
DATE_DURATION_SEC = 10
# How many seconds the Weather stays on screen
WEATHER_DURATION_SEC = 10
# Number of GIFs to play per rotation cycle
GIFS_COUNT = 5
# Number of Sprites to play per rotation cycle
SPRITE_COUNT = 1
# Comma-separated list of selected GIFs to play. Leave empty to play all.
SELECTED_GIFS = 
# Comma-separated list of selected Sprites. Leave empty to play all.
SELECTED_SPRITES = 

[DATE]
# ---------------------------------------------------------
# Date Screen Settings
# ---------------------------------------------------------
# Date style ID
THEME = 11
# Background image to show behind the date (must be in /gifs/ or /fighters_*/ folders)
BACKGROUND_SPRITE = stage1.png
# Format of the date (DD/MM, MM/DD, YYYY/MM/DD)
FORMAT = DD/MM
# Font index (-1 uses default system font)
DATE_FONT = -1
DATE_SIZE = 2
DATE_OFFSET_X = 0
DATE_OFFSET_Y = 0
DATE_COLOR_1 = #ffffff
DATE_COLOR_2 = #ffffff

[WEATHER]
# ---------------------------------------------------------
# Weather Settings (OpenWeatherMap)
# ---------------------------------------------------------
# Get your free API key at openweathermap.org
API_KEY = your_api_key_here
# Target city (e.g., Paris,FR or New York,US)
CITY = Paris,FR
WEATHER_OFFSET_X = 0
WEATHER_OFFSET_Y = 0

[STANDBY]
# ---------------------------------------------------------
# Night Mode Settings
# ---------------------------------------------------------
# If true, the matrix will automatically turn off at night
NIGHT_MODE_ENABLED = false
# Time to turn off the display (HH:MM format)
TURN_OFF_AT = 23:00
# Time to wake up and turn on the display (HH:MM format)
WAKE_UP_AT = 07:00

